{% extends "base.html" %}{% block content %}<section class="auth-shell"><div class="auth-copy"><p class="eyebrow">JOIN MEDIFIND</p><h1>Find or list medicines nearby.</h1><p>Register as a shopkeeper to create your protected pharmacy portal. Your shop becomes visible after administrator verification.</p></div><form class="auth-card" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><h2>Create account</h2><label>Your name<input name="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password (8+ characters)<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Account type<select name="role" id="role" onchange="document.getElementById('shop-fields').hidden=this.value!=='shopkeeper'"><option value="customer" {% if selected_role == 'customer' %}selected{% endif %}>Customer</option><option value="shopkeeper" {% if selected_role == 'shopkeeper' %}selected{% endif %}>Shopkeeper</option></select></label><div id="shop-fields" {% if selected_role != 'shopkeeper' %}hidden{% endif %}><label>Pharmacy name<input name="shop_name"></label><label>Phone<input name="phone"></label><label>Address<input name="address"></label><label>Latitude<input name="lat" type="number" step="any"></label><label>Longitude<input name="lon" type="number" step="any"></label></div><button>Create account</button><p class="switch">Already registered? <a href="/login">Login</a></p></form></section>{% endblock %}
